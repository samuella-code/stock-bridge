services:
  - type: web
    name: stockbridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn --workers 2 --threads 4 --timeout 120 "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockbridge-db
          property: connectionString
databases:
  - name: stockbridge-db
    databaseName: stockbridge
    user: stockbridge
