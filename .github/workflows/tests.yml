name: Tests
on:
  push:
    branches: [main, release/staging-phase6, feature/product-inventory]
  pull_request:
    branches: [main, release/staging-phase6]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: node tests/staff_invitation_dom.cjs
      - run: pytest -q
