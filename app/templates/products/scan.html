{% extends 'base.html' %}{% block page_title %}Scan Barcode{% endblock %}{% block content %}
<section class="dashboard-wrap"><a href="{{url_for('products.index')}}">← Products</a><h2>Find a product by barcode</h2><p>A barcode identifies a product. You still enter its name, stock and prices when adding a new product.</p><div class="panel-card form-stack" id="barcode-lookup" data-lookup="{{url_for('products.lookup')}}" data-create="{{url_for('products.create')}}"><label>Barcode<input id="barcode-value" maxlength="80" autocomplete="off"></label><button type="button" class="secondary-btn" data-scan-target="#barcode-value">Scan Barcode</button><button type="button" class="primary-btn" id="find-barcode">Find Product</button><div id="barcode-result" aria-live="polite"></div></div></section>{% endblock %}
{% block scripts %}<script src="{{url_for('static',filename='js/barcode.js')}}" defer></script>{% endblock %}
