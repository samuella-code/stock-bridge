<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | StockBridge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
</head>
<body>
  <main class="error-page">
    <a class="brand" href="/">StockBridge</a>
    <p class="status">Error {{ status }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="home-link" href="/">Return to StockBridge</a>
    <p class="reference">Request reference: <code>{{ request_id }}</code></p>
  </main>
</body>
</html>
