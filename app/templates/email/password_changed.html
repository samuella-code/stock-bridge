{% extends "email/base.html" %}{% block content %}
<h1 style="font-size:24px;color:#102437;margin:0 0 16px;">Your password was changed</h1>
<p>Hi {{ name.split()[0] }},</p><p>Your StockBridge password was changed. If this wasn't you, request a new password immediately.</p>
<p style="margin:28px 0;"><a href="{{ link }}" style="display:inline-block;background:#138450;color:#ffffff;text-decoration:none;padding:13px 22px;border-radius:6px;font-weight:bold;">Secure My Account</a></p>
<p style="font-size:13px;">Or visit <a href="{{ link }}">{{ link }}</a>.</p>
{% endblock %}
