{% extends "base.html" %}
{% block title %}Create new password · StockBridge{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-form-wrap">
        <div class="auth-form-card">
            <p class="eyebrow">Account recovery</p>
            <h2>Create a new password</h2>
            <p class="muted">Choose a password with at least eight characters.</p>
            <form method="POST" class="form-stack">
                <label>
                    <span>New password</span>
                    <input type="password" name="password" minlength="8" autocomplete="new-password" required autofocus>
                </label>
                <label>
                    <span>Confirm new password</span>
                    <input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                </label>
                <button class="primary-btn full-width" type="submit">Update password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
