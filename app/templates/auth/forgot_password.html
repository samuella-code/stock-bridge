{% extends "base.html" %}
{% block title %}Forgot password · StockBridge{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-form-wrap">
        <div class="auth-form-card">
            <p class="eyebrow">Account recovery</p>
            <h2>Reset your password</h2>
            <p class="muted">Enter your account email and we will send a secure reset link that expires in one hour.</p>
            <form method="POST" class="form-stack">
                <label>
                    <span>Email address</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus>
                </label>
                <button class="primary-btn full-width" type="submit">Send reset link</button>
            </form>
            <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
        </div>
    </div>
</section>
{% endblock %}
