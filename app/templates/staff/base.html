<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}StockBridge Staff{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/staff.css') }}"></head><body><a href="#content">Skip to content</a><header><strong>StockBridge · Staff Access</strong><nav aria-label="Staff navigation">{% if current_user.is_authenticated %}<a href="{{ url_for('staff.home') }}">My staff access</a>{% if not current_user.staff_only %}<a href="{{ url_for('main.dashboard') }}">My owner dashboard</a><a href="{{ url_for('staff.manage') }}">My staff management</a>{% endif %}<form method="POST" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% else %}<a href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}</nav></header><main id="content">{% if error|default('') %}<p role="alert" class="error">{{ error }}</p>{% endif %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='js/staff.js') }}" defer></script></body></html>
