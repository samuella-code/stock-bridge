{% extends "base.html" %}{% block page_title %}Profile & settings{% endblock %}{% block content %}<section class="dashboard-wrap"><div class="form-layout"><div><p class="eyebrow">Account</p><h2>Profile & settings</h2><p class="muted">Update the name shown in StockBridge and the active business name.</p></div><form class="panel-card form-stack" method="POST"><label><span>Full name</span><input name="full_name" value="{{current_user.full_name}}" required></label><label><span>Email</span><input value="{{current_user.email}}" disabled></label><label><span>Active business name</span><input name="business_name" value="{{business.name}}" required></label><a class="secondary-btn" href="{{ url_for('businesses.profile', business_id=business.id) }}">Business image &amp; profile</a><button class="primary-btn">Save changes</button><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"></form></div>{% include 'notifications/preferences.html' %}</section>{% endblock %}
