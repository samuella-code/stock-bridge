{% extends "base.html" %}{% block page_title %}Profile{% endblock %}{% block content %}<section class="dashboard-wrap"><div class="form-layout"><div><p class="eyebrow">Account</p><h2>Your profile</h2><p class="muted">Update the name shown in StockBridge and your workspace name.</p></div><form class="panel-card form-stack" method="POST"><label><span>Full name</span><input name="full_name" value="{{current_user.full_name}}" required></label><label><span>Email</span><input value="{{current_user.email}}" disabled></label><label><span>Business name</span><input name="business_name" value="{{business.name}}" required></label><button class="primary-btn">Save changes</button></form></div></section>{% endblock %}
