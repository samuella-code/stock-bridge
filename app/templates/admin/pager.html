{% if rows.pages>1 %}<nav class="pager" aria-label="Pages">{% if rows.has_prev %}<a href="{{url_for(request.endpoint,page=rows.prev_num,q=request.args.get('q',''),status=request.args.get('status','all'),action=request.args.get('action','all'))}}">Previous</a>{% endif %}<span>Page {{rows.page}} of {{rows.pages}}</span>{% if rows.has_next %}<a href="{{url_for(request.endpoint,page=rows.next_num,q=request.args.get('q',''),status=request.args.get('status','all'),action=request.args.get('action','all'))}}">Next</a>{% endif %}</nav>{% endif %}
