{% macro password_field(id, label, name='password', autocomplete='current-password', minlength=none, help=none, autofocus=false) -%}
<div class="customer-password">
  <label for="{{ id }}">{{ label }}</label>
  <div class="customer-password-input">
    <input id="{{ id }}" type="password" name="{{ name }}" autocomplete="{{ autocomplete }}" required{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if help %} aria-describedby="password-help"{% endif %}{% if autofocus %} autofocus{% endif %}>
    <button class="customer-password-toggle" type="button" data-customer-password-toggle="{{ id }}" aria-controls="{{ id }}" aria-label="Show {{ label|lower }}" aria-pressed="false" hidden>
      <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg data-eye-off viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="m3 3 18 18M10.5 5.1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3 3.9M6.2 6.2A21 21 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.8-1.8M10 10a3 3 0 0 0 4 4"/></svg>
    </button>
  </div>
  {% if help %}<small id="password-help">{{ help }}</small>{% endif %}
</div>
{%- endmacro %}
