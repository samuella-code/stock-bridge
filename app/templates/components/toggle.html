{% macro toggle(name, label, checked=false, hint='') -%}
<label class="sb-toggle-row"><span><span id="toggle-{{name}}-label">{{label}}</span>{% if hint %}<small id="toggle-{{name}}-hint">{{hint}}</small>{% endif %}</span><input class="sb-toggle" type="checkbox" role="switch" aria-checked="{{'true' if checked else 'false'}}" aria-labelledby="toggle-{{name}}-label"{% if hint %} aria-describedby="toggle-{{name}}-hint"{% endif %} name="{{name}}"{% if checked %} checked{% endif %}></label>
{%- endmacro %}
