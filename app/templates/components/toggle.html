{% macro toggle(name, label, checked=false, hint='', value=none, id_prefix='') -%}
{% set key=id_prefix ~ name ~ ('-' ~ value if value is not none else '') %}<label class="sb-toggle-row"><span><span id="toggle-{{key}}-label">{{label}}</span>{% if hint %}<small id="toggle-{{key}}-hint">{{hint}}</small>{% endif %}</span><input class="sb-toggle" type="checkbox" role="switch" aria-checked="{{'true' if checked else 'false'}}" aria-labelledby="toggle-{{key}}-label"{% if hint %} aria-describedby="toggle-{{key}}-hint"{% endif %} name="{{name}}"{% if value is not none %} value="{{value}}"{% endif %}{% if checked %} checked{% endif %}></label>
{%- endmacro %}
