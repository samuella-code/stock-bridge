<dialog hidden id="stockbridge-tour" aria-labelledby="tour-title" aria-describedby="tour-copy" data-endpoint="{{url_for('main.onboarding_tour_state')}}">
<h2 id="tour-title" tabindex="-1">Welcome to StockBridge!</h2><p id="tour-copy">Let's take a quick tour to show you how to manage your products, sales, inventory and business finances.</p><p id="tour-counter" aria-live="polite"></p><p id="tour-error" role="alert"></p><div class="tour-controls"><button type="button" class="primary-btn" data-tour-start>Start Tour</button><button type="button" class="secondary-btn" data-tour-back hidden>Back</button><button type="button" class="primary-btn" data-tour-next hidden>Next</button><button type="button" class="primary-btn" data-tour-finish hidden>Finish Tour</button><button type="button" class="secondary-btn" data-tour-skip>Skip Tour</button></div>
<script type="application/json" id="tour-state">{{onboarding_tour|tojson}}</script>
<script type="application/json" id="tour-links">{{[url_for('main.dashboard'),url_for('products.index'),url_for('products.index',view='inventory',sort='priority'),url_for('sales.index'),url_for('restocking.index'),url_for('expenses.index'),url_for('main.reports')]|tojson}}</script></dialog>
